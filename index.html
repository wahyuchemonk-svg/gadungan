<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadungan — Manajemen Gudang</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --border: #e0ddd3;
    --ink: #24231f;
    --muted: #71695a;
    --accent: #b5651d;
    --accent-ink: #ffffff;
    --danger: #b3392c;
    --success: #3a7d44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  header button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: #fdfcf9;
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 15px;
    font-weight: 600;
    margin-top: 16px;
    cursor: pointer;
  }
  button.secondary {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    margin-top: 8px;
    cursor: pointer;
  }
  button.small {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 13px;
    cursor: pointer;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #barcodeWrap { display: none; text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  #barcodeWrap svg { background: #fff; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .scan-result { background: #fdfcf9; border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 12px; }
  .scan-result .kode { font-family: monospace; color: var(--muted); font-size: 12px; }
  .scan-result .nama { font-weight: 600; font-size: 15px; margin: 2px 0; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 10px 0 14px; padding-top: 10px; border-top: 1px solid var(--border); }
  .info-grid .info-label { display: block; font-size: 11px; color: var(--muted); }
  .info-grid span:last-child { font-size: 14px; font-weight: 600; }
  .stok-list { list-style: none; margin: 0; padding: 0; }
  .stok-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .stok-list li:last-child { border-bottom: none; }
  .stok-list .nama { font-weight: 600; font-size: 14px; }
  .stok-list .kode { font-family: monospace; font-size: 11px; color: var(--muted); }
  .stok-list .sisa { font-size: 15px; font-weight: 600; }
  .sisa.low { color: var(--danger); }
  .stok-list li.clickable {
    cursor: pointer;
    margin: 0 -18px;
    padding: 10px 18px;
    border-radius: 8px;
    transition: background 0.1s;
  }
  .stok-list li.clickable:hover { background: var(--bg); }
  .stok-list li.clickable:active { background: #eae7dc; }
  .stok-right { display: flex; align-items: center; gap: 8px; }
  .chevron { color: var(--muted); font-size: 18px; line-height: 1; }
  .foto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 4px; }
  .foto-slot {
    aspect-ratio: 1 / 1;
    border: 1px dashed var(--border);
    border-radius: 10px;
    background: #fdfcf9;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 8px;
  }
  .foto-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-slot .btn-hapus-foto {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(36,35,31,0.7);
    color: #fff;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    max-width: 480px;
    margin: 0 auto;
  }
  nav button {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 0 10px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  nav button.active { color: var(--accent); font-weight: 600; }
  nav button .icon { display: block; font-size: 18px; margin-bottom: 2px; }
  .view { display: none; }
  .view.active { display: block; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef0e5; color: var(--success); margin-left: 6px; }
  .badge.warn { background: #f7e6e3; color: var(--danger); }
  #loginView { max-width: 340px; margin: 60px auto; padding: 0 16px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }
</style>
</head>
<body>

<div id="loginView">
  <div class="card">
    <h2>Masuk ke Gadungan</h2>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" autocomplete="current-password">
    <p class="error" id="loginError"></p>
    <button class="primary" id="btnLogin">Masuk</button>
  </div>
</div>

<div id="appShell" style="display:none;">
  <header>
    <h1>Gadungan</h1>
    <button id="btnLogout">Keluar</button>
  </header>

  <main>

    <section class="view active" id="view-stok">
      <div class="card">
        <h2>Daftar barang</h2>
        <input type="text" id="stokSearch" placeholder="Cari nama atau kode barang" style="margin-bottom:8px;">
        <select id="stokSort" style="margin-bottom:12px;">
          <option value="nama_asc">Nama (A-Z)</option>
          <option value="nama_desc">Nama (Z-A)</option>
          <option value="stok_asc">Sisa stok: sedikit dulu</option>
          <option value="stok_desc">Sisa stok: banyak dulu</option>
          <option value="terbaru">Terbaru ditambah</option>
        </select>
        <ul class="stok-list" id="stokList"></ul>
        <p class="empty" id="stokEmpty" style="display:none;">Belum ada barang. Tambah lewat tab "Buat kode".</p>
      </div>
    </section>

    <section class="view" id="view-scan">
      <div class="card">
        <h2>Scan barang</h2>
        <div id="reader"></div>
        <button class="secondary" id="btnToggleScan">Mulai kamera</button>

        <div style="margin-top:12px;">
          <input type="text" id="manualKode" placeholder="Ketik kode atau nama barang">
          <div id="manualResults"></div>
        </div>

        <div class="scan-result" id="scanResult" style="display:none;">
          <p class="kode" id="scanKode"></p>
          <p class="nama" id="scanNama"></p>
          <div class="info-grid" id="scanInfo">
            <div><span class="info-label">Harga beli</span><span id="infoHargaBeli"></span></div>
            <div><span class="info-label">Harga jual</span><span id="infoHargaJual"></span></div>
            <div><span class="info-label">Margin</span><span id="infoMargin"></span></div>
            <div><span class="info-label">Sisa stok</span><span id="infoSisaStok"></span></div>
          </div>
          <label for="scanJenis">Jenis transaksi</label>
          <select id="scanJenis">
            <option value="masuk">Stok masuk</option>
            <option value="keluar">Stok keluar</option>
          </select>
          <label for="scanJumlah">Jumlah</label>
          <input type="number" id="scanJumlah" min="1" value="1">
          <div id="scanAsalWrap">
            <label for="scanAsal">Asal barang</label>
            <input type="text" id="scanAsal" placeholder="Contoh: Toko Maju Jaya">
          </div>
          <div id="scanHargaWrap">
            <label for="scanHargaBeli">Harga beli saat ini</label>
            <input type="number" id="scanHargaBeli" min="0">
          </div>
          <p class="error" id="scanError"></p>
          <button class="primary" id="btnSimpanMutasi">Simpan transaksi</button>
          <button class="secondary" id="btnBatalScan" type="button">Batal</button>
        </div>
        <div class="scan-result" id="scanNotFound" style="display:none;">
          <p>Kode <span id="scanKodeBaru" class="kode"></span> belum terdaftar.</p>
          <button class="secondary" id="btnKeProduk">Daftarkan sebagai barang baru</button>
        </div>
      </div>
    </section>

    <section class="view" id="view-generator">
      <div class="card">
        <h2>Barang baru + kode</h2>
        <label for="genNama">Nama barang</label>
        <input type="text" id="genNama" placeholder="Contoh: Baterai ABC AAA isi 3">
        <label for="genKode">Kode barang</label>
        <div class="row">
          <input type="text" id="genKode" readonly>
          <button class="small" id="btnGenKode" type="button">Acak</button>
        </div>
        <label for="genHargaBeli">Harga beli</label>
        <input type="number" id="genHargaBeli" min="0" value="0">
        <label for="genHargaJual">Harga jual</label>
        <input type="number" id="genHargaJual" min="0" value="0">
		<p class="error" id="genError"></p>
		<p class="hint" id="genSuccess" style="display:none; color:var(--success);"></p>
		<button class="primary" id="btnSimpanProduk">Simpan barang</button>

        <div id="barcodeWrap">
          <svg id="barcodeSvg"></svg>
          <p id="barcodeLabel" style="margin:8px 0 0; font-size:14px;"></p>
          <button class="secondary" id="btnPrint">Cetak label</button>
          <button class="secondary" id="btnTambahFotoBaru" type="button">+ Tambah foto</button>
        </div>
      </div>
    </section>

    <section class="view" id="view-detail">
      <div class="card">
        <button class="secondary" id="btnDetailBack" type="button">&larr; Kembali ke Stok</button>
        <h2 id="detailNama" style="margin-top:14px;"></h2>
        <p class="kode" id="detailKode" style="font-family:monospace; color:var(--muted); font-size:12px; margin:0 0 8px;"></p>
        <div class="info-grid">
          <div><span class="info-label">Harga beli</span><span id="detailHargaBeli"></span></div>
          <div><span class="info-label">Harga jual</span><span id="detailHargaJual"></span></div>
          <div><span class="info-label">Margin</span><span id="detailMargin"></span></div>
          <div><span class="info-label">Sisa stok</span><span id="detailSisaStok"></span></div>
        </div>
        <label>Foto produk (maks 4)</label>
        <div class="foto-grid" id="fotoGrid"></div>
        <input type="file" id="fotoInput" accept="image/*" style="display:none;">
        <p class="error" id="fotoError"></p>
        <p class="hint" id="fotoLoading" style="display:none;">Mengunggah foto...</p>
      </div>
    </section>

  </main>

  <nav>
    <button data-view="view-stok" class="active"><span class="icon">&#128230;</span>Stok</button>
    <button data-view="view-scan"><span class="icon">&#128247;</span>Scan</button>
    <button data-view="view-generator"><span class="icon">&#127991;</span>Buat kode</button>
  </nav>
</div>

<script>
const SUPABASE_URL = "https://nsbvzqmezvhqgoaaxddr.supabase.co";
const SUPABASE_KEY = "sb_publishable__Do3g-HIiJKsFVajpeGTaw_DWg50Jvx";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let scannerActive = false;
let html5QrCode = null;
let scanFoundProduk = null;
let scanFoundKode = null;
let produkBaruTerakhir = null;

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === id));
}
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    showView(b.dataset.view);
    if (b.dataset.view === 'view-stok') loadStok();
  });
});

async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    currentUser = data.session.user;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    loadStok();
  } else {
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('appShell').style.display = 'none';
  }
}

document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  if (!email || !pass) {
    err.textContent = 'Isi email dan password dulu';
    err.style.display = 'block';
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = 'Email atau password salah';
    err.style.display = 'block';
    return;
  }
  checkSession();
});

document.getElementById('btnLogout').addEventListener('click', async () => {
  await sb.auth.signOut();
  checkSession();
});

let stokData = [];

async function loadStok() {
  const { data, error } = await sb
    .from('gudang_produk')
    .select('*')
    .order('nama_barang', { ascending: true });
  if (error) return;
  stokData = data || [];
  renderStok();
}

function sortStokData(arr) {
  const mode = document.getElementById('stokSort').value;
  const sorted = [...arr];
  if (mode === 'nama_desc') {
    sorted.sort((a, b) => b.nama_barang.localeCompare(a.nama_barang));
  } else if (mode === 'stok_asc') {
    sorted.sort((a, b) => Number(a.sisa_stok) - Number(b.sisa_stok));
  } else if (mode === 'stok_desc') {
    sorted.sort((a, b) => Number(b.sisa_stok) - Number(a.sisa_stok));
  } else if (mode === 'terbaru') {
    sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  } else {
    sorted.sort((a, b) => a.nama_barang.localeCompare(b.nama_barang));
  }
  return sorted;
}

function renderStok() {
  const list = document.getElementById('stokList');
  const empty = document.getElementById('stokEmpty');
  const term = document.getElementById('stokSearch').value.trim().toLowerCase();

  const filteredRaw = term
    ? stokData.filter(p =>
        p.nama_barang.toLowerCase().includes(term) ||
        p.kode_barang.toLowerCase().includes(term))
    : stokData;
  const filtered = sortStokData(filteredRaw);

  list.innerHTML = '';
  if (filtered.length === 0) {
    empty.textContent = term
      ? 'Tidak ada barang yang cocok.'
      : 'Belum ada barang. Tambah lewat tab "Buat kode".';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  filtered.forEach(p => {
    const li = document.createElement('li');
    li.className = 'clickable';
    const low = Number(p.sisa_stok) <= 3;
    li.innerHTML = `
      <div>
        <div class="nama">${escapeHtml(p.nama_barang)}</div>
        <div class="kode">${escapeHtml(p.kode_barang)}</div>
      </div>
      <div class="stok-right">
        <div class="sisa ${low ? 'low' : ''}">${p.sisa_stok}</div>
        <span class="chevron">&#8250;</span>
      </div>
    `;
    li.addEventListener('click', () => openDetail(p));
    list.appendChild(li);
  });
}

document.getElementById('stokSearch').addEventListener('input', renderStok);
document.getElementById('stokSort').addEventListener('change', renderStok);

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatRupiah(n) {
  return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
}

function randomKode() {
  const n = Math.floor(1000 + Math.random() * 9000);
  return 'WRG-' + n;
}
document.getElementById('genKode').value = randomKode();
document.getElementById('btnGenKode').addEventListener('click', () => {
  document.getElementById('genKode').value = randomKode();
});

document.getElementById('btnSimpanProduk').addEventListener('click', async () => {
  const nama = document.getElementById('genNama').value.trim();
  const kode = document.getElementById('genKode').value.trim();
  const hb = Number(document.getElementById('genHargaBeli').value) || 0;
  const hj = Number(document.getElementById('genHargaJual').value) || 0;
  const err = document.getElementById('genError');
  err.style.display = 'none';
  if (!nama) {
    err.textContent = 'Isi nama barang dulu';
    err.style.display = 'block';
    return;
  }
  const { data: produkBaruData, error } = await sb.from('gudang_produk').insert({
    user_id: currentUser.id,
    kode_barang: kode,
    nama_barang: nama,
    harga_beli: hb,
    harga_jual: hj,
    sisa_stok: 0
  }).select().single();
  if (error) {
    err.textContent = error.message.includes('duplicate') ? 'Kode barang sudah dipakai, klik Acak lagi' : 'Gagal menyimpan: ' + error.message;
    err.style.display = 'block';
    return;
  }
  produkBaruTerakhir = produkBaruData;
  JsBarcode('#barcodeSvg', kode, { format: 'CODE128', width: 2, height: 60, fontSize: 14, margin: 8 });
  document.getElementById('barcodeLabel').textContent = nama;
  document.getElementById('barcodeWrap').style.display = 'block';

  const success = document.getElementById('genSuccess');
  success.textContent = 'Barang "' + nama + '" berhasil disimpan';
  success.style.display = 'block';
  setTimeout(() => { success.style.display = 'none'; }, 3000);

  document.getElementById('genNama').value = '';
  document.getElementById('genHargaBeli').value = 0;
  document.getElementById('genHargaJual').value = 0;
  document.getElementById('genKode').value = randomKode();

loadStok();
});

document.getElementById('btnPrint').addEventListener('click', () => {
  const svg = document.getElementById('barcodeSvg').outerHTML;
  const label = document.getElementById('barcodeLabel').textContent;
  const w = window.open('', '_blank');
  w.document.write('<html><body style="text-align:center;font-family:sans-serif;padding-top:40px;">' + svg + '<p>' + label + '</p></body></html>');
  w.document.close();
  w.print();
});

document.getElementById('btnTambahFotoBaru').addEventListener('click', () => {
  if (produkBaruTerakhir) openDetail(produkBaruTerakhir);
});

document.getElementById('btnToggleScan').addEventListener('click', async () => {
  if (!scannerActive) {
    html5QrCode = new Html5Qrcode('reader');
    try {
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 220, height: 120 } },
        onScanSuccess
      );
      scannerActive = true;
      document.getElementById('btnToggleScan').textContent = 'Hentikan kamera';
    } catch (e) {
      document.getElementById('scanResult').style.display = 'none';
      alert('Tidak bisa akses kamera. Pastikan izin kamera diaktifkan.');
    }
  } else {
    await html5QrCode.stop();
    scannerActive = false;
    document.getElementById('btnToggleScan').textContent = 'Mulai kamera';
  }
});

let manualSearchTimer = null;
document.getElementById('manualKode').addEventListener('input', () => {
  clearTimeout(manualSearchTimer);
  const term = document.getElementById('manualKode').value.trim();
  const resultsEl = document.getElementById('manualResults');
  if (!term) {
    resultsEl.style.display = 'none';
    resultsEl.innerHTML = '';
    return;
  }
  manualSearchTimer = setTimeout(() => searchManual(term), 300);
});

async function searchManual(term) {
  const resultsEl = document.getElementById('manualResults');
  const { data } = await sb
    .from('gudang_produk')
    .select('kode_barang, nama_barang')
    .or(`kode_barang.ilike.%${term}%,nama_barang.ilike.%${term}%`)
    .limit(8);

  resultsEl.innerHTML = '';
  resultsEl.style.display = 'block';

  if (!data || data.length === 0) {
    resultsEl.innerHTML = '<div class="hint" style="padding:8px 0;">Tidak ditemukan. <button class="small" id="btnDaftarBaruManual" type="button">Daftarkan sebagai barang baru</button></div>';
    document.getElementById('btnDaftarBaruManual').addEventListener('click', () => {
      document.getElementById('genKode').value = term;
      document.getElementById('manualKode').value = '';
      resultsEl.style.display = 'none';
      showView('view-generator');
    });
    return;
  }

  data.forEach(p => {
    const item = document.createElement('div');
    item.className = 'scan-result';
    item.style.cursor = 'pointer';
    item.style.marginTop = '8px';
    item.innerHTML = '<p class="kode">' + escapeHtml(p.kode_barang) + '</p><p class="nama">' + escapeHtml(p.nama_barang) + '</p>';
    item.addEventListener('click', () => {
      resultsEl.style.display = 'none';
      resultsEl.innerHTML = '';
      document.getElementById('manualKode').value = '';
      onScanSuccess(p.kode_barang);
    });
    resultsEl.appendChild(item);
  });
}

async function onScanSuccess(decodedText) {
  if (html5QrCode && scannerActive) {
    await html5QrCode.stop();
    scannerActive = false;
    document.getElementById('btnToggleScan').textContent = 'Mulai kamera';
  }
  const { data } = await sb
    .from('gudang_produk')
    .select('*')
    .eq('kode_barang', decodedText)
    .maybeSingle();

  document.getElementById('scanResult').style.display = 'none';
  document.getElementById('scanNotFound').style.display = 'none';

  if (data) {
    scanFoundProduk = data;
    scanFoundKode = decodedText;
    document.getElementById('scanKode').textContent = decodedText;
    document.getElementById('scanNama').textContent = data.nama_barang;
    document.getElementById('infoHargaBeli').textContent = formatRupiah(data.harga_beli);
    document.getElementById('infoHargaJual').textContent = formatRupiah(data.harga_jual);
    document.getElementById('infoMargin').textContent = formatRupiah(data.margin);
    document.getElementById('infoSisaStok').textContent = data.sisa_stok;
    document.getElementById('scanHargaBeli').value = data.harga_beli;
    toggleScanFields();
    document.getElementById('scanResult').style.display = 'block';
  } else {
    document.getElementById('scanKodeBaru').textContent = decodedText;
    document.getElementById('scanNotFound').style.display = 'block';
    document.getElementById('genKode').value = decodedText;
  }
}

document.getElementById('scanJenis').addEventListener('change', toggleScanFields);
function toggleScanFields() {
  const jenis = document.getElementById('scanJenis').value;
  document.getElementById('scanAsalWrap').style.display = jenis === 'masuk' ? 'block' : 'none';
  document.getElementById('scanHargaWrap').style.display = jenis === 'masuk' ? 'block' : 'none';
}

document.getElementById('btnKeProduk').addEventListener('click', () => {
  showView('view-generator');
});

document.getElementById('btnBatalScan').addEventListener('click', () => {
  document.getElementById('scanResult').style.display = 'none';
  document.getElementById('scanError').style.display = 'none';
  scanFoundProduk = null;
  scanFoundKode = null;
});

document.getElementById('btnSimpanMutasi').addEventListener('click', async () => {
  const jenis = document.getElementById('scanJenis').value;
  const jumlah = Number(document.getElementById('scanJumlah').value);
  const err = document.getElementById('scanError');
  err.style.display = 'none';
  if (!jumlah || jumlah <= 0) {
    err.textContent = 'Isi jumlah yang benar';
    err.style.display = 'block';
    return;
  }
  const payload = {
    user_id: currentUser.id,
    produk_id: scanFoundProduk.id,
    jenis: jenis,
    jumlah: jumlah
  };
  if (jenis === 'masuk') {
    payload.asal_barang = document.getElementById('scanAsal').value.trim() || null;
    payload.harga_beli_saat_itu = Number(document.getElementById('scanHargaBeli').value) || null;
  }
  const { error } = await sb.from('gudang_mutasi_stok').insert(payload);
  if (error) {
    err.textContent = 'Gagal menyimpan: ' + error.message;
    err.style.display = 'block';
    return;
  }
  document.getElementById('scanResult').style.display = 'none';
  showView('view-stok');
  loadStok();
});

const FOTO_BUCKET = 'gudang-foto';
let detailProduk = null;

function openDetail(p) {
  detailProduk = p;
  document.getElementById('detailNama').textContent = p.nama_barang;
  document.getElementById('detailKode').textContent = p.kode_barang;
  document.getElementById('detailHargaBeli').textContent = formatRupiah(p.harga_beli);
  document.getElementById('detailHargaJual').textContent = formatRupiah(p.harga_jual);
  document.getElementById('detailMargin').textContent = formatRupiah(p.margin);
  document.getElementById('detailSisaStok').textContent = p.sisa_stok;
  document.getElementById('fotoError').style.display = 'none';
  renderFotoGrid();
  showView('view-detail');
}

document.getElementById('btnDetailBack').addEventListener('click', () => {
  showView('view-stok');
});

function fotoPublicUrl(path) {
  return sb.storage.from(FOTO_BUCKET).getPublicUrl(path).data.publicUrl;
}

function renderFotoGrid() {
  const grid = document.getElementById('fotoGrid');
  grid.innerHTML = '';
  const paths = detailProduk.foto_paths || [];
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement('div');
    slot.className = 'foto-slot';
    const path = paths[i];
    if (path) {
      const img = document.createElement('img');
      img.src = fotoPublicUrl(path);
      slot.appendChild(img);
      const btnHapus = document.createElement('button');
      btnHapus.type = 'button';
      btnHapus.className = 'btn-hapus-foto';
      btnHapus.textContent = '\u00d7';
      btnHapus.addEventListener('click', (e) => {
        e.stopPropagation();
        hapusFoto(i);
      });
      slot.appendChild(btnHapus);
    } else {
      slot.textContent = '+ Tambah foto';
      slot.addEventListener('click', () => {
        document.getElementById('fotoInput').click();
      });
    }
    grid.appendChild(slot);
  }
}

document.getElementById('fotoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) await uploadFoto(file);
});

async function uploadFoto(file) {
  const err = document.getElementById('fotoError');
  const loading = document.getElementById('fotoLoading');
  err.style.display = 'none';
  const paths = detailProduk.foto_paths || [];
  if (paths.length >= 4) {
    err.textContent = 'Sudah 4 foto, hapus salah satu dulu.';
    err.style.display = 'block';
    return;
  }
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${detailProduk.kode_barang}/${Date.now()}.${ext}`;

  loading.style.display = 'block';
  const { error: uploadError } = await sb.storage.from(FOTO_BUCKET).upload(path, file);
  if (uploadError) {
    loading.style.display = 'none';
    err.textContent = 'Gagal unggah foto: ' + uploadError.message;
    err.style.display = 'block';
    return;
  }

  const newPaths = [...paths, path];
  const { error: updateError } = await sb
    .from('gudang_produk')
    .update({ foto_paths: newPaths })
    .eq('id', detailProduk.id);

  loading.style.display = 'none';
  if (updateError) {
    err.textContent = 'Gagal simpan data foto: ' + updateError.message;
    err.style.display = 'block';
    return;
  }

  detailProduk.foto_paths = newPaths;
  syncFotoPathsKeStokData(newPaths);
  renderFotoGrid();
}

async function hapusFoto(idx) {
  const err = document.getElementById('fotoError');
  err.style.display = 'none';
  const paths = detailProduk.foto_paths || [];
  const path = paths[idx];
  if (!path) return;

  const { error: removeError } = await sb.storage.from(FOTO_BUCKET).remove([path]);
  if (removeError) {
    err.textContent = 'Gagal hapus foto: ' + removeError.message;
    err.style.display = 'block';
    return;
  }

  const newPaths = paths.filter((_, i) => i !== idx);
  const { error: updateError } = await sb
    .from('gudang_produk')
    .update({ foto_paths: newPaths })
    .eq('id', detailProduk.id);

  if (updateError) {
    err.textContent = 'Gagal simpan data foto: ' + updateError.message;
    err.style.display = 'block';
    return;
  }

  detailProduk.foto_paths = newPaths;
  syncFotoPathsKeStokData(newPaths);
  renderFotoGrid();
}

function syncFotoPathsKeStokData(newPaths) {
  const item = stokData.find(x => x.id === detailProduk.id);
  if (item) item.foto_paths = newPaths;
}

checkSession();
</script>
